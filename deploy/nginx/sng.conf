# SigmatNG — production-конфиг nginx для Next.js.
#
# Схема: nginx (80/443, TLS) -> next start на 127.0.0.1:3000
#
# Файл включается в http-блок (директивы upstream и map допустимы только там):
#   Linux:   /etc/nginx/conf.d/sng.conf
#   Windows: добавьте "include C:/nginx/conf/sng.conf;" внутрь http { } в conf/nginx.conf
#
# Перед запуском замените:
#   sng.example.ru        -> ваш домен (в блоках server_name и в проверке Host)
#   /etc/letsencrypt/...  -> пути к сертификату и ключу
#     Windows: ssl_certificate C:/nginx/certs/fullchain.pem;
#
# Подробная инструкция по развёртыванию — в README.md, раздел
# «Развёртывание в production с HTTPS (nginx)».

upstream sng_next {
    server 127.0.0.1:3000;
    # keepalive к апстриму здесь не включаем: заголовок Connection занят
    # поддержкой WebSocket (см. map ниже). Для одного Node на loopback
    # выигрыш от переиспользования соединений пренебрежимо мал.
}

# Корректное проксирование WebSocket: нужно, если через этот же прокси
# открывать next dev (HMR) или если появятся realtime-эндпоинты.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: ACME-челлендж Let's Encrypt остаётся доступным, всё остальное — на HTTPS.
server {
    listen      80;
    # Если IPv6 на сервере отключён, строки "listen [::]:..." нужно удалить,
    # иначе nginx не запустится ("Address family not supported").
    listen      [::]:80;
    server_name sng.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # nginx >= 1.25.1; для более старых версий: "listen 443 ssl http2;" и без этой строки.
    http2       on;
    server_name sng.example.ru;

    ssl_certificate     /etc/letsencrypt/live/sng.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sng.example.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS включайте только после того, как HTTPS проверен: браузер запомнит
    # требование и перестанет открывать сайт по HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Загрузка документов: MAX_UPLOAD_BYTES (10 МБ) + запас на multipart-обёртку.
    # Значение согласовано с experimental.proxyClientMaxBodySize в next.config.ts.
    client_max_body_size 12m;
    client_body_timeout  60s;
    keepalive_timeout    65s;

    # Запросы с чужим Host не обслуживаем. Добавьте алиасы (например, www) в шаблон,
    # если они нужны: ^(sng\.example\.ru|www\.sng\.example\.ru)$
    if ($host !~* ^sng\.example\.ru$) {
        return 444;
    }

    location / {
        proxy_pass         http://sng_next;
        proxy_http_version 1.1;

        # Эти заголовки обязательны для корректной работы приложения:
        #   Host / X-Forwarded-Host — lib/auth/csrf.ts сверяет Origin с
        #       "x-forwarded-host || host", иначе сохранение вернёт 403;
        #   X-Forwarded-For / X-Real-IP — lib/auth/rate-limit.ts берёт из них IP
        #       для ограничения попыток входа;
        #   X-Forwarded-Proto — сообщает приложению, что клиент пришёл по HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Без этого nginx буферизует ответ и ломает стриминг RSC/SSR.
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
